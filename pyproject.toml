[project]
name = "rag-gsm"
version = "0.1.0"
description = "Mini RAG pipeline cho chinh sach GSM (Green SM) - du an hoc"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bm25s>=0.3.11",
    "httpx>=0.28",
    "lancedb>=0.39.0",
    "numpy>=2.0",
    "sentence-transformers>=6.1.0",
    "sentencepiece>=0.2.2",
    "streamlit>=1.64.0",
    "transformers>=5.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
ocr-baseoff = [
    "docling>=2.130.0",
    "easyocr>=1.7.2",
    "ocrmac>=1.0.1",
    "onnxruntime>=1.30.0",
    "rapidocr>=3.9.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_gsm"]
